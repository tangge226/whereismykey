name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: swift --version
      - name: Build, isolated self-tests, and CLI smoke test
        run: ./Scripts/test.sh
      - name: Swift Package tests
        run: swift test
      - name: Source installer smoke test (isolated)
        run: |
          set -eu
          fixture="$(mktemp -d "$RUNNER_TEMP/wherekey-install.XXXXXXXX")"
          trap 'rm -rf "$fixture"' EXIT
          ./Scripts/install-local.sh --skip-build --app-dir "$fixture/Applications" --bin-dir "$fixture/bin" --with-codex-skill --codex-skills-dir "$fixture/skills"
          "$fixture/bin/wherekey" --help > /dev/null
          ./Scripts/install-local.sh --skip-build --app-dir "$fixture/Applications" --bin-dir "$fixture/bin" --with-codex-skill --codex-skills-dir "$fixture/skills"
          codesign --verify --deep --strict "$fixture/Applications/WhereKey.app"
