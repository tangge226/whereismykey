name: 功能建议
description: 描述需要解决的使用问题
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在做什么，现有流程在哪一步不方便？请使用虚构服务名。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 可描述流程、界面或 CLI 行为，不需要提供真实凭证。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法
